<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bqGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DA7756"/>
      <stop offset="100%" stop-color="#B95D3F"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EAB8C"/>
      <stop offset="100%" stop-color="#6F8E6D"/>
    </linearGradient>
    <filter id="bqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A1815" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="120" height="120" rx="30" fill="#FAF9F5"/>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="#E5E2D9" stroke-width="2"/>
  
  <!-- Outer Biometric Eye Contour -->
  <g filter="url(#bqGlow)">
    <!-- Eye Upper Arch -->
    <path d="M22 60 C38 34, 82 34, 98 60" fill="none" stroke="url(#bqGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Eye Lower Arch (Smile Blink Curve) -->
    <path d="M22 60 C38 82, 82 82, 98 60" fill="none" stroke="url(#bqGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 0" opacity="0.85"/>
    
    <!-- Central Iris & Pupil Aperture -->
    <circle cx="60" cy="60" r="18" fill="none" stroke="url(#bqGrad)" stroke-width="4.5"/>
    <circle cx="60" cy="60" r="9" fill="url(#bqGrad)"/>
    <!-- Focus Gaze Core Spark -->
    <circle cx="56.5" cy="56.5" r="3.5" fill="#FFFFFF"/>
    
    <!-- Horizon Blink Pulse Guides -->
    <line x1="12" y1="60" x2="18" y2="60" stroke="url(#sageGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="102" y1="60" x2="108" y2="60" stroke="url(#sageGrad)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
